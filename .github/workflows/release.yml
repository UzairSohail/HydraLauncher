name: Release

# Builds Windows and Linux from master and publishes
# them as the only release in the repository. Builds upload straight to a
# draft release (no workflow artifacts, so the Actions storage quota is not
# used). Once both are in, the draft is published and every older release,
# its tag and any leftover workflow artifacts are deleted, so the Releases
# page only ever holds the latest version. Pull requests do not build.

# Runs only when started by hand (Actions > Release > Run workflow), so merges
# don't spend the account's Actions minutes.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Work out the release tag
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # A rebuild of the same version replaces that release.
      - name: Create a draft release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."

  build:
    needs: prepare

    permissions:
      contents: write

    # Fetch Electron and electron-builder's helper binaries (AppImage, snap,
    # NSIS templates) from npmmirror instead of GitHub release downloads,
    # which have been answering 504 Gateway Time-out.
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      # Built into hydra-native (via Cloud Save Manager) so Google sign-in for
      # cloud saves and settings sync works without a local client.json.
      # Anyone with a build can extract these, so keep the repo private.
      CSM_GOOGLE_CLIENT_ID: ${{ secrets.CSM_GOOGLE_CLIENT_ID }}
      CSM_GOOGLE_CLIENT_SECRET: ${{ secrets.CSM_GOOGLE_CLIENT_SECRET }}

    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare native caches
        id: native-cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "hydra-vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $platform = if ($env:RUNNER_OS -eq "Windows") { "windows-static" } else { "linux" }
          $image = "$env:ImageOS-$env:ImageVersion"
          "image=$image" >> $env:GITHUB_OUTPUT
          "prefix=v1-vcpkg-$env:RUNNER_OS-$image-$arch-$arch-$platform" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/hydra-native -> target
          shared-key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache.outputs.image }}
          cache-bin: false

      # A current committed bridge needs no vcpkg packages at all.
      - name: Check prebuilt torrent bridge
        id: torrent-bridge
        run: node scripts/torrent-bridge-prebuilt.cjs check

      # vcpkg checks each package ABI, including the compiler and build flags.
      # Keep fallback restores within the same runner image and target triplet.
      - name: Restore vcpkg binary packages
        if: steps.torrent-bridge.outputs.current != 'true'
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.native-cache.outputs.prefix }}-${{ hashFiles('native/torrent-bridge/**/vcpkg*.json', 'native/torrent-bridge/**/triplets/**') }}
          restore-keys: |
            ${{ steps.native-cache.outputs.prefix }}-

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar autoconf automake libtool gcc-mingw-w64-x86-64

      # Lets cargo fetch private git dependencies (cloud-save-manager) when a
      # token with read access is stored as the PRIVATE_REPO_TOKEN secret.
      - name: Allow private git dependencies
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          [ -n "$PRIVATE_REPO_TOKEN" ] || exit 0
          git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      # Install scripts download Electron and Ludusavi from GitHub releases,
      # which sometimes answer 504; try the whole install up to 3 times.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            yarn --frozen-lockfile && exit 0
            echo "Install failed (attempt $attempt), retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          exit 1

      # Save before packaging so later failures do not discard compiled dependencies.
      - name: Save vcpkg binary packages
        if: steps.torrent-bridge.outputs.current != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: yarn build:linux --publish never
        env:
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}

      - name: Build Windows
        if: matrix.os == 'windows-2022'
        run: yarn build:win --publish never
        env:
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
          MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL }}
          MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL }}
          MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL }}
          RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RENDERER_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RENDERER_VITE_REAL_DEBRID_REFERRAL_ID: ${{ vars.RENDERER_VITE_REAL_DEBRID_REFERRAL_ID }}
          RENDERER_VITE_TORBOX_REFERRAL_CODE: ${{ vars.RENDERER_VITE_TORBOX_REFERRAL_CODE }}
          MAIN_VITE_LAUNCHER_SUBDOMAIN: ${{ vars.MAIN_VITE_LAUNCHER_SUBDOMAIN }}

      - name: Upload build to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.zip dist/*.AppImage dist/*.snap dist/*.deb \
            dist/*.rpm dist/*.tar.gz dist/*.yml dist/*.blockmap)
          upload=()
          for f in "${files[@]}"; do
            [ "$(basename "$f")" = "builder-debug.yml" ] || upload+=("$f")
          done
          if [ ${#upload[@]} -eq 0 ]; then
            echo "No build files found in dist/"
            exit 1
          fi
          gh release upload "$TAG" "${upload[@]}" --clobber

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest

      - name: Delete older releases and their tags
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            [ "$tag" = "$TAG" ] && continue
            echo "Deleting release $tag"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" || true
          done

      - name: Delete workflow artifacts
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts" --jq '.artifacts[].id' |
          while read -r id; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" || true
          done
